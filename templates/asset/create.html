[[extend 'layout.html']]

[[block header]]
[[icon='fa-solid fa-warehouse']]
[[breadcamp = 'Asset Create']]
[[end]]

[[block content]]
<style>
    .readonly-select {
        pointer-events: none;  /* prevents clicking */
        background-color: #e9ecef; /* greyed out like disabled */
    }
</style>
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom mx-2">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Create Asset</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="[[=URL('asset/index')]]" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container py-2">
        <form id="uploadForm" action="[[=URL('asset','submit')]]" method="post" enctype="multipart/form-data">
            <div id="custom_form">

                <div class="row mb-2">
                    <div class="col-md-12">
                        <div class="border border-primary rounded p-2 pb-1 shadow-sm accordion-primary">
                            <!-- Header row: only this will be clickable -->
                            <div class="d-flex justify-content-between align-items-center mb-2 accordion-header" style="cursor: pointer;">
                                <strong class="text-primary">Import from Purchase</strong>
                                <div class="form-check form-switch" style="flex-shrink: 0;">
                                    <input class="form-check-input" type="checkbox" id="importSwitch" 
                                        style="width: 50px; height: 25px; transform: scale(1.2); transform-origin: center; 
                                            border-color: #0d6efd;">
                                </div>
                            </div>

                            <div class="row collapse" id="collapseImport">
                                <div class="col-md-6 mb-2">
                                    <label for="purchase_import" class="form-label"><strong>Purchase ID | Vendor Name | Bill No</strong></label>
                                    <select id="purchase_import" class="form-select form-select-sm select_custom text-primary custom-select-primary">
                                        <option value="" selected disabled hidden>Click to load assets</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <label for="purchase_details_import" class="form-label"><strong>Purchase Detail ID | Type | Brand | Model | Color | Available</strong></label>
                                    <select id="purchase_details_import" class="form-select form-select-sm select_custom text-primary custom-select-primary">
                                        <option value="" selected disabled hidden>Click to load assets</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row">
                    <input type="hidden" id="req_id" name="req_id">
                    <input type="hidden" id="purchase_head_id" name="purchase_head_id">
                    <input type="hidden" id="purchase_details_id" name="purchase_details_id">

                     <div class="col-md-3">
                        <div class="row">
                            <div class="mb-2">
                                <label for="asset_type" class="form-label"><strong>Vehicle Type <span class="is_required">*</span></strong></label>
                                <select class="form-select form-select-sm select_custom" id="asset_type" name="asset_type">
                                    <option value="">Select Vehicle Type</option>
                                    [[for asset_type in asset_type_list:]]
                                        <option value="[[=asset_type]]">
                                            [[=asset_type]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>

                            <div class="mb-2">
                                <label for="asset_brand" class="form-label"><strong>Vehicle Brand <span class="is_required">*</span></strong></label>
                                <select class="form-select form-select-sm select_custom" id="asset_brand" name="asset_brand">
                                    <option value="">Select Vehicle Brand</option>
                                    [[for asset_brand in asset_brand_list:]]
                                        <option value="[[=asset_brand]]">
                                            [[=asset_brand]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>

                            <div class="mb-2">
                                <label for="asset_model" class="form-label"><strong>Vehicle Model <span class="is_required">*</span></strong></label>
                                <select class="form-select form-select-sm select_custom" id="asset_model" name="asset_model">
                                    <option value="">Select Vehicle Model</option>
                                    [[for asset_model in asset_model_list:]]
                                        <option value="[[=asset_model]]">
                                            [[=asset_model]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>

                            <div class="mb-2">
                                <label for="asset_color" class="form-label"><strong>Vehicle Color <span class="is_required">*</span></strong></label>
                                <select class="form-select form-select-sm select_custom" id="asset_color" name="asset_color">
                                    <option value="">Select Vehicle Color</option>
                                    [[for asset_color in asset_color_list:]]
                                        <option value="[[=asset_color]]">
                                            [[=asset_color]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>

                            <div class="mb-2">
                                <label for="purchase_price" class="form-label"><strong>Purchase Price <span class="is_required">*</span></strong></label>
                                <input type="number" class="form-control form-control-sm" id="purchase_price" name="purchase_price">
                            </div>
                        </div>
                     </div>

                    <div class="col-md-3">
                        <div class="row">

                            <div class="mb-2">
                                <label for="asset_name" class="form-label"><strong>Vehicle Name</strong></label>
                                <input type="text" class="form-control form-control-sm" id="asset_name" name="asset_name">
                            </div>

                            <div class="mb-2">
                                <label for="asset_model_year" class="form-label"><strong>Vehicle Model Year</strong></label>
                                <input type="text" class="form-control form-control-sm" id="asset_model_year" name="asset_model_year">
                            </div>

                            <div class="mb-2">
                                <label for="registration_no" class="form-label"><strong>Registration No</strong></label>
                                <input type="text" class="form-control form-control-sm" id="registration_no" name="registration_no">
                            </div>

                            <div class="mb-2">
                                <label for="engine_no" class="form-label"><strong>Engine No</strong></label>
                                <input type="text" class="form-control form-control-sm" id="engine_no" name="engine_no">
                            </div>

                            <div class=" mb-2">
                                <label for="engine_info" class="form-label"><strong>Engine Info</strong></label>
                                <input type="text" class="form-control form-control-sm" id="engine_info" name="engine_info">
                            </div>

                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="row">
                            
                            <div class="mb-2">
                                <label for="chasis_no" class="form-label"><strong>Chasis No</strong></label>
                                <input type="text" class="form-control form-control-sm" id="chasis_no" name="chasis_no">
                            </div>


                            <div class="mb-2">
                                <label for="registration_date" class="form-label"><strong>Registration Date</strong></label>
                                <div class="flatpickr-wrapper">
                                    <input type="text" class="date-picker" id="registration_date" name="registration_date" placeholder="Registration Date">
                                    <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>
                                </div>
                            </div>

                            <div class="mb-2">
                                <label for="first_issue_date" class="form-label"><strong>First Issue Date</strong></label>
                                <div class="flatpickr-wrapper">
                                    <input type="text" class="date-picker" id="first_issue_date" name="first_issue_date" placeholder="First Issue Date">
                                    <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>
                                </div>
                            </div>

                            <div class="mb-2">
                                <label for="asset_status" class="form-label"><strong>Vehicle Status</strong></label>
                                <select class="form-select form-select-sm select_custom" id="asset_status" name="asset_status">
                                    <option value="">Select Asset Status</option>
                                    [[for asset_status in asset_status_list:]]
                                        <option value="[[=asset_status]]">
                                            [[=asset_status]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>

                            <div class="mb-2">
                                <label for="asset_condition" class="form-label"><strong>Vehicle Condition</strong></label>
                                <select class="form-select form-select-sm select_custom" id="asset_condition" name="asset_condition">
                                    <option value="">Select Asset Condition</option>
                                    [[for asset_condition in asset_condition_list:]]
                                        <option value="[[=asset_condition]]">
                                            [[=asset_condition]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="row">
                            
                            <div class="mb-2">
                                <label for="current_location" class="form-label"><strong>Current Location</strong></label>
                                <input type="text" class="form-control form-control-sm" id="current_location" name="current_location">
                            </div>

                            <div class="mb-2">
                                <label for="owner" class="form-label"><strong>Owner</strong></label>
                                <select class="form-select form-select-sm select_custom" id="owner" name="owner">
                                    <option value="">Select Owner</option>
                                    [[for owner in owner_list:]]
                                        <option value="[[=owner]]" [[if owner==cid:]] selected [[pass]]>
                                            [[=owner]]
                                        </option>
                                    [[pass]]
                                </select>
                            </div>
                        </div>
                    </div>                    
                </div>

                <div class="mt-2 mb-3">
                    <button type="submit" class="btn btn-primary" name="action" value="save">
                        <i class="fa-solid fa-floppy-disk"></i> <span class="ms-2">Save</span>
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>
[[end]]

[[block scripts]]
<script>
$(document).ready(function() {
    let purchaseAssetMap = [];
    let purchaseMap = [];
    let manualAssetChange = true;

    const headerDiv = document.querySelector('.accordion-header'); 
    const importSwitch = document.getElementById('importSwitch');
    const collapseDiv = document.getElementById('collapseImport');
    const bsCollapse = new bootstrap.Collapse(collapseDiv, { toggle: false });

    headerDiv.addEventListener('click', function(e) {
        if (['INPUT', 'SELECT', 'LABEL'].includes(e.target.tagName)) return;
        importSwitch.checked = !importSwitch.checked;
        if (importSwitch.checked) bsCollapse.show();
        else bsCollapse.hide();
    });

    // When accordion opens → fetch purchase map
    $('#collapseImport').on('shown.bs.collapse', function () {
        const $dropdown = $('#purchase_import');
        if (purchaseMap.length === 0) {
            $.get('/expense/asset/get_purchase_map', function(resp) {
                purchaseMap = resp.results;
                $dropdown.empty().append($('<option>', { value: '', text: 'Select Purchase' }));
                resp.results.forEach(function(item) {
                    $dropdown.append($('<option>', { 
                        value: item.purchase_head_id, 
                        text: `${item.purchase_head_id ?? '-'} | ${item.vendor_name ?? '-'} | ${item.bill_no ?? '-'}` 
                    }));
                });
            });
        }
    });

    $('#collapseImport').on('hidden.bs.collapse', function () {
        importSwitch.checked = false;
    });

    $('#importSwitch').on('change', function() {
        if ($(this).is(':checked')) $('#collapseImport').collapse('show');
        else $('#collapseImport').collapse('hide');
    });

    // Purchase head selection → load purchase details
    $('#purchase_import').on('change', function() {
        const purchaseHeadId = $(this).val();
        const $detailsDropdown = $('#purchase_details_import');
        $detailsDropdown.empty().append($('<option>', { value: '', text: 'Loading...' }));

        $.getJSON('/expense/asset/get_purchase_details_map', { purchase_head_id: purchaseHeadId })
            .done(function(resp) {
                purchaseAssetMap = resp.results;
                $detailsDropdown.empty().append($('<option>', { value: '', text: 'Select Purchase Detail' }));
                resp.results.forEach(function(item) {
                    $detailsDropdown.append($('<option>', { 
                        value: item.purchase_details_id, 
                        text: `${item.purchase_details_id ?? ''} | ${item.asset_type ?? ''} | ${item.asset_brand ?? ''} | ${item.asset_model ?? ''} | ${item.asset_color ?? ''} | ${item.available_to_create ?? ''}` 
                    }));
                });
            });
    });

    // Purchase detail selection → auto-fill asset_type/brand/model only
    $('#purchase_details_import').on('change', function() {
        const selectedId = $(this).val();
        const selectedItem = purchaseAssetMap.find(item => String(item.purchase_details_id) === String(selectedId));

        if (selectedItem) {
            manualAssetChange = false;

            // Set asset_type/brand/model and lock
            $('#asset_type').html(`<option value="${selectedItem.asset_type}">${selectedItem.asset_type}</option>`)
                .val(selectedItem.asset_type);

            $('#asset_brand').html(`<option value="${selectedItem.asset_brand}">${selectedItem.asset_brand}</option>`)
                .val(selectedItem.asset_brand);

            $('#asset_model').html(`<option value="${selectedItem.asset_model}">${selectedItem.asset_model}</option>`)
                .val(selectedItem.asset_model);

            $('#asset_color').html(`<option value="${selectedItem.asset_color}">${selectedItem.asset_color}</option>`)
                .val(selectedItem.asset_color);

            $('#purchase_price').val(selectedItem.item_price);

            // Hidden fields for purchase
            $('#req_id').val(selectedItem.req_id);
            $('#purchase_head_id').val(selectedItem.purchase_head_id);
            $('#purchase_details_id').val(selectedItem.purchase_details_id);

            // ✅ DO NOT set asset_name here – backend will generate it
            manualAssetChange = true;
        } else {
            resetAssetFields();
        }
    });

    // $('#asset_type').on('change', function() {
    //     if (!manualAssetChange) return;
    //     const type = $(this).val();
    //     if (type) {
    //         $.getJSON("[[=URL('asset','get_brands_by_type')]]", { asset_type: type })
    //             .done(function(resp) {
    //                 const $brand = $('#asset_brand');
    //                 $brand.empty().append('<option value="">Select Asset Brand</option>');
    //                 resp.results.forEach(b => $brand.append($('<option>', { value: b, text: b })));
    //                 $brand.val('').prop('disabled', false);
    //                 $('#asset_model').empty().append('<option value="">Select Asset Model</option>').prop('disabled', false);
    //             });
    //     } else {
    //         $('#asset_brand').empty().append('<option value="">Select Asset Brand</option>').prop('disabled', false);
    //         $('#asset_model').empty().append('<option value="">Select Asset Model</option>').prop('disabled', false);
    //     }
    // });

    // // Asset brand → load models
    // $('#asset_brand').on('change', function() {
    //     if (!manualAssetChange) return;
    //     const type = $('#asset_type').val();
    //     const brand = $(this).val();
    //     if (type && brand) {
    //         $.getJSON("[[=URL('asset','get_models_by_brand')]]", { asset_type: type, asset_brand: brand })
    //             .done(function(resp) {
    //                 const $model = $('#asset_model');

});
</script>
[[end]]
