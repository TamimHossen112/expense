[[extend 'layout.html']]

[[block header]]
[[icon='fa fa-cubes']]
[[breadcamp = 'Create Asset']]
[[end]]

[[block content]]
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom mx-2">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Create</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="[[=URL('asset_type/index')]]" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container py-2">
        <form action="[[=URL('asset_type','submit')]]" method="POST">
            <div id="custom_form">        
                <div class="row">

                    <!-- Asset Type -->
                    <div class="col-md-3 mb-3">
                        <label for="asset_type" class="form-label">
                            <strong>Vehicle Type <span class="is_required">*</span></strong>
                        </label>
                        <select class="form-select form-select-sm select_custom" id="asset_type" name="asset_type">
                            <option value="">Select Vehicle Type</option>
                            [[for asset_type in asset_types:]]
                                <option value="[[=asset_type]]">[[=asset_type]]</option>
                            [[pass]]
                        </select>
                    </div>

                    <!-- Asset Brand -->
                    <div class="col-md-3 mb-3">
                        <label for="asset_brand" class="form-label">
                            <strong>Vehicle Brand <span class="is_required">*</span></strong>
                        </label>
                        <select class="form-select form-select-sm select_custom" id="asset_brand" name="asset_brand">
                            <option value="">Select Vehicle Brand</option>
                            [[for asset_brand in asset_brands:]]
                                <option value="[[=asset_brand]]">[[=asset_brand]]</option>
                            [[pass]]
                        </select>
                    </div>

                    <!-- Asset Model -->
                    <div class="col-md-3 mb-3">
                        <label for="asset_model" class="form-label">
                            <strong>Vehicle Model <span class="is_required">*</span></strong>
                        </label>
                        <select class="form-select form-select-sm select_custom" id="asset_model" name="asset_model">
                            <option value="">Select Vehicle Model</option>
                            [[for asset_model in asset_models:]]
                                <option value="[[=asset_model]]">[[=asset_model]]</option>
                            [[pass]]
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label for="asset_model" class="form-label">
                            <strong>Vehicle Color <span class="is_required">*</span></strong>
                        </label>
                        <select class="form-select form-select-sm select_custom" id="asset_color" name="asset_color">
                            <option value="">Select Vehicle Color</option>
                            [[for asset_color in asset_colors:]]
                                <option value="[[=asset_color]]">[[=asset_color]]</option>
                            [[pass]]
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="col-md-3 mb-3">
                        <label for="asset_desc" class="form-label">
                            <strong>Description (Max 1000 Characters)</strong>
                        </label>
                        <textarea id="asset_desc" name="asset_desc" class="form-control form-control-sm" 
                                  style="height:auto; min-height: 6.2rem; border-radius: 0.4rem;"
                                  oninput="this.style.height='auto'; this.style.height = this.scrollHeight + 'px'"></textarea>
                    </div>

                    <!-- Status -->
                    <div class="col-md-3">
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="active" checked id="status" name="status">
                                <label class="form-check-label" for="status">Active</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-start">
                            <div class="me-2">
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Save</span>
                                </button>
                            </div>
                            <div>
                                <button type="reset" class="btn btn-sm btn-light">
                                    <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
[[end]]

[[block scripts]]
<!-- Make sure Select2 JS and CSS are included -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function () {
    // Enable Select2 with tags:true
    $('#asset_type, #asset_brand, #asset_model, #asset_color').select2({
        tags: true,
        width: '100%',
        placeholder: "Select or add new"
    });
});
</script>
[[end]]
