[[extend 'layout.html']]
[[block content]]
<div id="formContainer">
    <div class="container-section">
        <div class="d-flex justify-content-between align-items-center border-bottom mx-2">
            <span class="icon-text icon-text-bold">
                <i class="fa-solid fa-edit"></i>
                <span>Edit Requisition</span>
            </span>
        </div>

        <div class="container py-2">
            <form id="uploadForm" action="[[=URL('requisition_field','submit')]]" method="post" enctype="multipart/form-data">
                <input type="hidden" name="requisition_id" value="[[=record['id']]]">

                <div id="custom_form">
                    <div class="row">
                        <!-- Left Column -->
                        <div class="col-md-3 col-sm-12">
                            <div class="mb-2">
                                <label for="emp_id" class="form-label">Employee Id | Employee Name</label>
                                <input type="text" class="form-control form-control-sm" id="emp_id" value="[[=record['emp_id']]] | [[=record['emp_name']]]" readonly>
                            </div>
                            <div class="mb-2">
                                <label for="emp_category" class="form-label">Employee Category</label>
                                <input type="text" class="form-control form-control-sm" id="emp_category" value="[[=record['emp_category']]]" readonly>
                            </div>
                            <div class="mb-2">
                                <label for="designation" class="form-label">Designation</label>
                                <input type="text" class="form-control form-control-sm" id="designation" value="[[=record['designation']]]" readonly>
                            </div>
                            <div class="mb-2">
                                <label for="tr_code" class="form-label">Territory Code</label>
                                <input type="text" class="form-control form-control-sm" id="tr_code" value="[[=record['tr_code']]]" readonly>
                            </div>
                            <div class="mb-2">
                                <label for="head_office" class="form-label">Location</label>
                                <input type="text" class="form-control form-control-sm" id="head_office" value="[[=record['head_office']]]" readonly>
                            </div>
                            <div class="mb-2">
                                <label for="joining_date" class="form-label">Joining Date <span class="is_required">*</span></label>
                                <input type="text" class="form-control form-control-sm" id="joining_date" value="[[=record['joining_date']]]" readonly>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="col-md-9 col-sm-12">
                            <div class="row">
                                <div class="col-md-4 col-sm-12">
                                    <div class="mb-2">
                                        <label for="asset_type" class="form-label">Vehicle Type <span class="is_required">*</span></label>
                                        <select class="form-select form-select-sm select_custom" id="asset_type" name="asset_type" required>
                                            <option value="">Select Asset Type</option>
                                            [[for asset_detail in asset_types:]]
                                                <option value="[[=asset_detail['id']]]" [[='selected' if asset_detail['text']==selected_asset_type else '']]>[[=asset_detail['text']]]</option>
                                            [[pass]]
                                        </select>
                                    </div>
                                    <div class="mb-2">
                                        <label for="license_number" class="form-label">Driving License No <span class="is_required">*</span></label>
                                        <input type="text" class="form-control form-control-sm" id="license_number" name="license_number" value="[[=record['license_number']]]" required>
                                    </div>
                                </div>

                                <div class="col-md-4 col-sm-12">
                                    <div class="mb-2">
                                        <label for="license_issue_date" class="form-label">Driving License Issue Date <span class="is_required">*</span></label>
                                        <div class="flatpickr-wrapper">
                                            <input type="text" class="date-picker form-control form-control-sm" id="license_issue_date" name="license_issue_date" value="[[=record['license_issue_date']]]" required>
                                            <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <label for="license_expire_date" class="form-label">Driving License Expire Date <span class="is_required">*</span></label>
                                        <div class="flatpickr-wrapper">
                                            <input type="text" class="date-picker form-control form-control-sm" id="license_expire_date" name="license_expire_date" value="[[=record['license_expire_date']]]" required>
                                            <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>
                                        </div>
                                    </div>
                                </div>

                                <!-- File Upload Section -->
                                <div class="col-md-12 col-sm-12">
                                    <div class="mb-2"><strong>File Attachment Section</strong></div>
                                    <div class="border border-primary p-2 rounded">
                                        <div class="row">
                                            <div class="col-md-4 col-sm-12 mb-2">
                                                <label for="doc_type" class="form-label">Doc Type</label>
                                                <select class="form-select form-select-sm select_custom" id="doc_type" name="doc_type">
                                                    <option value="">Select Document Type</option>
                                                    [[for doc_type in doc_type_combos:]]
                                                        <option value="[[=doc_type]]">[[=doc_type]]</option>
                                                    [[pass]]
                                                </select>
                                            </div>
                                            <div class="col-md-6 col-sm-12 mb-2">
                                                <label for="formFile" class="form-label">Choose File</label>
                                                <input type="file" class="form-control form-control-sm" id="formFile" name="upload_file">
                                            </div>
                                            <div class="col-md-2 col-sm-12 d-flex align-items-end mb-2">
                                                <button id="uploadBtn" type="button" class="btn btn-sm btn-primary w-100">
                                                    <i class="fa-solid fa-upload"></i> Upload
                                                </button>
                                            </div>
                                        </div>

                                        <div id="uploadStatus"></div>

                                        <div style="margin-bottom:0; padding-bottom:0;">
                                            <div class="mb-1">Uploaded Files</div>
                                            <div class="table-responsive">
                                                <table class="table table-bordered table-sm mb-0" id="uploadedFilesTable">
                                                    <thead>
                                                        <tr>
                                                            <th>Doc Type</th>
                                                            <th>File Name</th>
                                                            <th>Action</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        [[for f in docs:]]
                                                            <tr>
                                                                <td>[[=f['doc_type']]]</td>
                                                                <td>[[=f['file_name']]]</td>
                                                                <td>
                                                                    <button type="button" class="btn btn-sm btn-info me-1" onclick="window.open('[[=IMAGE_DOWNLOAD_API]]/expense/[[=f['file_path']]]','_blank')"><i class="fa-solid fa-download"></i></button>
                                                                    <button type="button" class="btn btn-sm btn-danger remove-upload" data-file-path="[[=f['file_path']]]"><i class="fa-solid fa-trash"></i></button>
                                                                </td>
                                                            </tr>
                                                        [[pass]]
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <div id="uploadedFilesData"></div>

                <div class="mt-3 mb-3 d-flex justify-content-between">
                    <button type="submit" name="submit_type" value="draft" class="btn btn-secondary">
                        <i class="fa-solid fa-file"></i> Save Draft
                    </button>
                    <button type="submit" name="submit_type" value="pending" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
[[end]]

[[block scripts]]
<script>
    const uploadedFiles = [[=docs_json]] || [];
    const IMAGE_DOWNLOAD_API = "[[=IMAGE_DOWNLOAD_API]]";

    $(document).ready(function () {
        $('#doc_type').select2({placeholder: "Select Document Type", allowClear: true, width: "100%"});

        // hidden inputs on form submit
        $('#uploadForm').on('submit', function () {
            const $container = $('#uploadedFilesData').empty();
            $.each(uploadedFiles, function (index, fileData) {
                $.each(['doc_type','file_name','file_path'], function (_, key) {
                    $('<input>', {
                        type: 'hidden',
                        name: `uploaded_files[${index}][${key}]`,
                        value: fileData[key]
                    }).appendTo($container);
                });
            });
        });

        // upload new file
        $('#uploadBtn').on('click', function () {
            const $fileInput = $('#formFile');
            const docType = $('#doc_type').val();
            const $uploadStatus = $('#uploadStatus');
            const $tableBody = $('#uploadedFilesTable tbody');

            $uploadStatus.text('').removeClass('text-danger text-success');

            if (!docType || !$fileInput[0].files.length) {
                alert(!docType ? 'Select a document type.' : 'Choose a file.');
                return;
            }

            const file = $fileInput[0].files[0];
            const formData = new FormData();
            formData.append('upload_file', file);

            $.ajax({
                url: "[[=URL('requisition_field','upload_file')]]",
                method: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                dataType: 'json'
            }).done(function (data) {
                if (data.res_data) {
                    const uploadedFileData = {
                        doc_type: docType,
                        file_name: file.name,
                        file_path: data.res_data.ret_str
                    };
                    uploadedFiles.push(uploadedFileData);

                    const $row = $('<tr>').append(
                        $('<td>').text(uploadedFileData.doc_type),
                        $('<td>').text(uploadedFileData.file_name),
                        $('<td>').append(
                            $('<button>', { type: 'button', class: 'btn btn-sm btn-info me-1', html: '<i class="fa-solid fa-download"></i>' })
                                .on('click', function () {
                                    window.open(`${IMAGE_DOWNLOAD_API}/expense/${uploadedFileData.file_path}`, '_blank');
                                }),
                            $('<button>', { type: 'button', class: 'btn btn-sm btn-danger remove-upload', html: '<i class="fa-solid fa-trash"></i>' })
                                .on('click', function () {
                                    const index = uploadedFiles.indexOf(uploadedFileData);
                                    if (index > -1) uploadedFiles.splice(index, 1);
                                    $row.remove();
                                })
                        )
                    );
                    $tableBody.append($row);

                    $fileInput.val('');
                    $('#doc_type').val('').trigger('change');
                } else {
                    $uploadStatus.text('Upload failed: ' + (data.detail || 'Unknown error')).addClass('text-danger');
                }
            }).fail(function (xhr, status, error) {
                $uploadStatus.text('Upload error: ' + error).addClass('text-danger');
            });
        });

        // handle delete for already uploaded files
        $(document).on('click', '.remove-upload', function () {
            const filePath = $(this).data('file-path');
            const $row = $(this).closest('tr');
            const index = uploadedFiles.findIndex(f => f.file_path === filePath);
            if (index > -1) uploadedFiles.splice(index, 1);
            $row.remove();
        });
    });
</script>
[[end]]
