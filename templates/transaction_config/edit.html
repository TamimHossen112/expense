[[extend 'layout.html']]

[[block header]]
[[icon='fa-solid fa-cogs']]
[[breadcamp = 'Edit Transaction Config']]
[[end]]

[[block content]]
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom mx-2">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-pen-to-square"></i>
            <span>Edit Transaction Config</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="[[=URL('transaction_config','index')]]" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container py-2">
        <form action="[[=URL('transaction_config','update')]]" method="POST">
            <input type="hidden" name="id" value="[[=data['id']]]">
            <div id="custom_form">
                <div class="row g-3">

                    <!-- Transaction Type -->
                    <div class="col-md-3">
                        <label for="tr_type" class="form-label"><strong>Transaction Type <span class="is_required">*</span></strong></label>
                        <select class="form-select select_custom" id="tr_type" name="tr_type">
                            <option value="">Select or add Transaction Type</option>
                            [[for tr_type in tr_type_list:]]
                                <option value="[[=tr_type]]" [[='selected' if tr_type==selected_tr_type else '']]>[[=tr_type]]</option>
                            [[pass]]
                        </select>
                    </div>

                    <!-- SL -->
                    <div class="col-md-3">
                        <label for="sl" class="form-label"><strong>SL</strong></label>
                        <input type="number" class="form-control" id="sl" name="sl" value="[[=data['sl'] or '']]">
                    </div>

                    <!-- Section -->
                    <div class="col-md-3">
                        <label for="section" class="form-label"><strong>Section</strong></label>
                        <input type="text" class="form-control" id="section" name="section" value="[[=data['section']]]">
                    </div>

                    <!-- Order -->
                    <div class="col-md-3">
                        <label for="order" class="form-label"><strong>Order</strong></label>
                        <input type="number" class="form-control" id="order" name="order" value="[[=data['order'] or '']]">
                    </div>

                    <!-- Key -->
                    <div class="col-md-3">
                        <label for="key" class="form-label"><strong>Key</strong></label>
                        <input type="text" class="form-control" id="key" name="key" value="[[=data['key']]]">
                    </div>

                    <!-- Caption -->
                    <div class="col-md-3">
                        <label for="caption" class="form-label"><strong>Caption</strong></label>
                        <input type="text" class="form-control" id="caption" name="caption" value="[[=data['caption']]]">
                    </div>

                    <!-- Value -->
                    <div class="col-md-3">
                        <label for="value" class="form-label"><strong>Value</strong></label>
                        <input type="text" class="form-control" id="value" name="value" value="[[=data['value']]]">
                    </div>

                    <!-- Value Type -->
                    <div class="col-md-3">
                        <label for="value_type" class="form-label"><strong>Value Type</strong></label>
                        <select class="form-select select_custom" id="value_type" name="value_type">
                            <option value="">Select or add Value Type</option>
                            [[for vt in value_type_list:]]
                                <option value="[[=vt]]" [[='selected' if vt==selected_value_type else '']]>[[=vt]]</option>
                            [[pass]]
                        </select>
                    </div>

                    <!-- Source API -->
                    <div class="col-md-3">
                        <label for="source_api" class="form-label"><strong>Source API</strong></label>
                        <input type="text" class="form-control" id="source_api" name="source_api" value="[[=data['source_api']]]">
                    </div>

                    <!-- Value List -->
                    <div class="col-md-3">
                        <label for="value_list" class="form-label"><strong>Value List</strong></label>
                        <input type="text" class="form-control" id="value_list" name="value_list" value="[[=data['value_list']]]">
                    </div>

                    <!-- Default Value -->
                    <div class="col-md-3">
                        <label for="default_value" class="form-label"><strong>Default Value</strong></label>
                        <input type="text" class="form-control" id="default_value" name="default_value" value="[[=data['default_value']]]">
                    </div>

                </div>

                <!-- Buttons -->
                <div class="row mt-3">
                    <div class="col-12">
                        <div class="d-flex justify-content-start">
                            <div class="me-2">
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Save</span>
                                </button>
                            </div>
                            <div>
                                <button type="reset" class="btn btn-sm btn-light">
                                    <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>
[[end]]

[[block scripts]]
<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function () {
    // Enable Select2 with tags for tr_type and value_type
    $('#tr_type, #value_type').select2({
        tags: true,
        width: '100%',
        placeholder: "Select or add new"
    });
});
</script>
[[end]]
