[[extend 'layout.html']]

[[block header]]
[[icon='fa-solid fa-cogs']]
[[breadcamp = 'Transfer Create']]
[[end]]

[[block content]]
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom mx-2">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Create</span>
        </span>
        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="[[=URL('requisition/index')]]" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>
    <div class="container py-2">
        <form id="transferForm" method="post" action="[[=URL('transfer/save')]]">
            <div id="custom_form"></div>
            <button type="submit" class="btn btn-primary mt-3">Submit</button>
        </form>
    </div>
</div>

<script>
  fetch("[[=URL('transfer/configs')]]")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("custom_form");

      // Define order of sections
      const sectionOrder = ["Asset", "Transfer From", "Transfer To", "Approval"];

      sectionOrder.forEach(sectionName => {
        const sectionFields = data.fields.filter(f => f.section === sectionName);
        if (sectionFields.length === 0) return;

        // Section wrapper with border + rounded + padding
        const sectionDiv = document.createElement("div");
        sectionDiv.classList.add("mb-4", "border", "rounded", "p-3", "bg-light");
        sectionDiv.innerHTML = `
          <h6 class="border-bottom pb-2 mb-3">${sectionName}</h6>
          <div class="row" id="section-${sectionName.replace(/\s+/g, '-')}"></div>
        `;
        container.appendChild(sectionDiv);

        const sectionContainer = sectionDiv.querySelector(".row");

        sectionFields.forEach((field) => {
          let input = "";
          const name = field.key;
          const label = field.caption;

          if (field.value_type === "string") {
            input = `<input type="text" class="form-control" name="${name}" value="${field.default_value || ''}">`;
          } 
          else if (field.value_type === "integer") {
            input = `<input type="number" class="form-control" name="${name}" value="${field.default_value || ''}">`;
          } 
          else if (field.value_type === "date") {
            input = `<input type="text" class="form-control datepicker" name="${name}" value="${field.default_value || ''}">`;
          } 
          else if (field.value_type === "dropdown") {
            let options = "";
            if (field.value_list && field.value_list.length > 0) {
              options = field.value_list.map(val => {
                if (typeof val === "object") {
                  return `<option value="${val.value}" ${val.value===field.default_value?'selected':''}>${val.label}</option>`;
                } else {
                  return `<option value="${val}" ${val===field.default_value?'selected':''}>${val}</option>`;
                }
              }).join("");
            }
            input = `
              <select class="form-select form-select-sm select_custom" 
                      id="${name}" 
                      name="${name}" 
                      required>
                <option value="">Select ${label}</option>
                ${options}
              </select>`;
          } 
          else {
            input = `<input type="text" class="form-control" name="${name}" value="${field.default_value || ''}">`;
          }

          const col = document.createElement("div");
          col.classList.add("col-md-4", "mb-3");
          col.innerHTML = `
            <label class="form-label">${label}</label>
            ${input}
          `;
          sectionContainer.appendChild(col);
        });
      });

      // ✅ Initialize flatpickr for all date inputs
      flatpickr(".datepicker", { dateFormat: "Y-m-d" });

      // ✅ Initialize Select2 (if available) after all dropdowns are injected
      if (window.$ && $.fn.select2) {
        $("select").select2({
          width: "100%" // makes sure it adapts to container width
        });
      }
    });
</script>

[[end]]
